services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prayfortheocean-web
    ports:
      - "5174:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
