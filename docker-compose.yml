services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: prayfortheocean-web
    ports:
      - "5174:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stdin_open: true
    tty: true

  prod-preview:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: prayfortheocean-prod
    ports:
      - "8084:80"
    restart: unless-stopped
