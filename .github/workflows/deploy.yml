name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID || 'G-3ZJ8LD67KJ' }}

      - name: Deploy to S3
        run: |
          for BUCKET in ${{ vars.S3_BUCKET || 'prayfororangecounty.com prayfortheocean.com' }}; do
            aws s3 sync ./dist s3://$BUCKET --delete
            aws s3 cp ./dist/index.html s3://$BUCKET/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
            aws s3 cp ./dist/dashboard/index.html s3://$BUCKET/dashboard/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
            aws s3 cp ./dist/surf/index.html s3://$BUCKET/surf/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
            aws s3 cp ./dist/trestles/index.html s3://$BUCKET/trestles/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
            aws s3 cp ./dist/shrine/index.html s3://$BUCKET/shrine/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E27UERX00AWR8K' }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
