name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }} --delete
          aws s3 cp ./dist/index.html s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }}/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
          aws s3 cp ./dist/dashboard/index.html s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }}/dashboard/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
          aws s3 cp ./dist/surf/index.html s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }}/surf/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
          aws s3 cp ./dist/trestles/index.html s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }}/trestles/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
          aws s3 cp ./dist/shrine/index.html s3://${{ vars.S3_BUCKET || 'prayfororangecounty.com' }}/shrine/index.html --cache-control "public, max-age=0, must-revalidate" --content-type "text/html"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
